<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveCode — Real-time Code Sharing with Copy Protection</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Prism JS syntax highlighting styles -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  
  <!-- xterm.js Terminal Library -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/style.css?v=38">
</head>
<body class="theme-obsidian">

  <!-- Main App Shell -->
  <div id="app" class="app-container">
    
    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">LiveCode</span>
        </div>
        <span id="userRoleBadge" class="user-role-badge guest" title="Click to rename username">Guest</span>
      </div>

      <!-- Room Title & Quick Link -->
      <div class="room-identity">
        <div class="room-id-chip live-sharing-off" id="roomShareBtn">
          <span class="pulse-dot off"></span>
          <span class="room-text-wrapper">
            <span class="room-label">LIVE</span>
            <span class="room-id" id="displayRoomId">------</span>
          </span>
          <label class="toggle-switch-mini" id="liveSharingToggleLabel" title="Toggle Live Code Sharing ON/OFF">
            <input type="checkbox" id="toggleLiveSharing">
            <span class="slider-mini"></span>
          </label>
          <svg class="copy-icon" id="roomCopyIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" title="Copy shareable link"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
        </div>
      </div>

      <!-- Protection Control Panel -->
      <div class="protection-panel" id="protectionPanel">
        <div class="protection-toggles">
          <!-- Copy Protection Switch -->
          <label class="icon-toggle" title="Prevent guests from copying code" id="copyProtectionToggleLabel">
            <input type="checkbox" id="toggleCopyProtection">
            <span class="icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
          </label>

          <!-- Paste Protection Switch -->
          <label class="icon-toggle" id="pasteProtectionToggleLabel" title="Prevent pasting external code into editor">
            <input type="checkbox" id="togglePasteProtection">
            <span class="icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
            </span>
          </label>

          <!-- Read-Only Mode Switch -->
          <label class="icon-toggle" id="readOnlyToggleLabel" title="Make room read-only for participants">
            <input type="checkbox" id="toggleReadOnly">
            <span class="icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </span>
          </label>

          <!-- Syntax Highlighting Switch -->
          <label class="icon-toggle" id="syntaxHighlightToggleLabel" title="Toggle syntax highlighting ON/OFF">
            <input type="checkbox" id="toggleSyntaxHighlight" checked>
            <span class="icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.563-2.512 5.563-5.563C21.437 6.438 17.203 2 12 2z"></path></svg>
            </span>
          </label>
        </div>
      </div>

      <!-- Right Header Actions -->
      <div class="header-actions">
        <!-- Language Selector -->
        <div class="select-wrapper custom-dropdown" id="languageSelectWrapper">
          <button type="button" id="languageDropdownBtn" class="styled-select dropdown-trigger" title="Select Language">
            <span id="languageSelectedLabel">Python 3</span>
            <svg class="dropdown-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div id="languageDropdownMenu" class="custom-dropdown-menu hidden">
            <div class="dropdown-item selected" data-value="python">
              <span>Python 3</span>
              <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
          </div>
          <select id="languageSelect" class="styled-select" style="display: none;">
            <option value="python" selected>Python 3</option>
          </select>
        </div>

        <button id="formatCodeBtn" class="btn btn-secondary btn-icon" title="Format Code (Shift+Alt+F)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="21" y1="18" x2="3" y2="18"></line></svg>
        </button>

        <button id="runCodeBtn" class="btn btn-success btn-icon" title="Run Code">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>

        <button id="downloadCodeBtn" class="btn btn-secondary btn-icon" title="Download Code File">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </button>

        <button id="copyCodeBtn" class="btn btn-secondary btn-icon" title="Copy Code to Clipboard">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>

        <button id="settingsBtn" class="btn btn-secondary btn-icon" title="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </header>

    <!-- Main Workspace Section -->
    <main class="workspace">

      <!-- Floating Sidebar Expand Tab (Visible when sidebar is collapsed) -->
      <button id="sidebarExpandBtn" class="drawer-edge-tab drawer-edge-left hidden" title="Show File Tree">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>

      <!-- Left Sidebar Drawer: Files & Collaborators -->
      <aside class="sidebar" id="sidebar">
        <!-- Files Section -->
        <div class="sidebar-header">
          <div style="display: flex; align-items: center; gap: 8px; min-width: 0;">
            <button id="sidebarCollapseBtn" class="header-arrow-btn" title="Hide Sidebar">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="sidebar-title" style="font-weight: 600; font-size: 0.9rem; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1;">Files</div>
          </div>
          <div style="display: flex; gap: 4px; align-items: center; flex-shrink: 0;">
            <button id="createFileBtn" class="btn btn-secondary btn-icon" style="width: 24px; height: 24px; padding: 2px; flex-shrink: 0;" title="New File">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
            </button>
            <button id="createFolderBtn" class="btn btn-secondary btn-icon" style="width: 24px; height: 24px; padding: 2px; flex-shrink: 0;" title="New Folder">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
            </button>
            <button id="collapseFoldersBtn" class="btn btn-secondary btn-icon" style="width: 24px; height: 24px; padding: 2px; flex-shrink: 0;" title="Collapse All">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
            </button>
            <button id="refreshFilesBtn" class="btn btn-secondary btn-icon" style="width: 24px; height: 24px; padding: 2px; flex-shrink: 0;" title="Refresh Files">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
            </button>
          </div>
        </div>
        <div class="sidebar-content" style="flex: 1; overflow-y: auto;">
          <div class="user-list" id="fileListContainer" style="padding: 8px;">
            <!-- Files populated here -->
          </div>
        </div>
      </aside>

      <!-- Center Code Editor Container -->
      <section class="editor-section">

        <!-- Editor Tabs Bar -->
        <div class="editor-tabs" id="editorTabs">
          <!-- Tabs populated here -->
        </div>

        <!-- Code Editor Area -->
        <div class="editor-wrapper" id="editorWrapper">
          <!-- Line Numbers Gutter -->
          <div class="editor-line-numbers" id="lineNumbers">1</div>

          <!-- Code Text Area / Highlighting Layer -->
          <div class="code-editor-area" id="codeEditorArea">
            <textarea id="codeTextarea" spellcheck="false" autocomplete="off" capitalize="off" placeholder="# Type or paste Python code here..."></textarea>

            <!-- Syntax Highlighting Display Layer -->
            <pre id="highlightPre" class="highlight-layer"><code id="highlightCode" class="language-python"></code></pre>

            <!-- Real-time Collaborator Cursors Layer -->
            <div class="collaborator-cursors" id="collaboratorCursors"></div>

            <!-- Dynamic Watermark Layer when Copying Disabled -->
            <div class="watermark-overlay" id="watermarkOverlay">
              <div class="watermark-text">LIVECODE PROTECTED • COPY DISABLED</div>
              <div class="watermark-text">LIVECODE PROTECTED • COPY DISABLED</div>
              <div class="watermark-text">LIVECODE PROTECTED • COPY DISABLED</div>
            </div>
          </div>
        </div>

        <!-- Output Terminal Drawer -->
        <div class="output-drawer" id="outputDrawer">
          <div class="output-header">
            <div class="output-title">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
              <span>Execution Console & Output</span>
              <span id="outputStatusBadge" class="output-status-badge hidden"></span>
            </div>
            <div class="output-actions">
              <button id="copyConsoleBtn" class="btn-text btn-icon-sm" title="Copy Output to Clipboard">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              </button>
              <button id="clearConsoleBtn" class="btn-text btn-icon-sm" title="Clear Console Output">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
              </button>
            </div>
          </div>
          <div class="output-body" id="consoleOutput"></div>
          <div id="htmlPreviewContainer" class="html-preview-container hidden">
            <iframe id="htmlPreviewFrame" title="HTML Output Preview"></iframe>
          </div>
        </div>

      </section>

      <!-- Floating Chat Drawer Expand Tab (Visible when chat is collapsed) -->
      <button id="chatDrawerExpandBtn" class="drawer-edge-tab drawer-edge-right hidden" title="Show Collaborators & Chat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>

      <!-- Right Drawer: Collaborators (Top Half) & Session Chat (Bottom Half) -->
      <aside class="chat-drawer" id="chatDrawer">
        <!-- Top Half: Collaborators -->
        <div class="drawer-section drawer-collaborators-section">
          <div class="drawer-section-header">
            <div style="display: flex; align-items: center; gap: 8px;">
              <!-- Distinctive Collaborators/Team Icon -->
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
              <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-primary); line-height: 1;">Collaborators</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span id="activeUserCount" class="badge-pill">1</span>
              <button id="closeChatBtn" class="header-arrow-btn" title="Hide Collaborators & Chat">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
              </button>
            </div>
          </div>
          <div class="user-list" id="userListContainer">
            <!-- Users populated here -->
          </div>
        </div>

        <!-- Bottom Half: Session Chat -->
        <!-- Bottom Half: Chat & Activity Tabs -->
        <div class="drawer-section drawer-chat-section">
          <div class="drawer-section-header drawer-tabs-header">
            <div class="drawer-tab-buttons">
              <button type="button" class="drawer-tab-btn active" id="drawerTabChatBtn" data-tab="chat">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
                <span>Chat</span>
                <span id="chatUnreadBadge" class="drawer-unread-badge hidden">0</span>
              </button>
              <button type="button" class="drawer-tab-btn" id="drawerTabActivityBtn" data-tab="activity">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
                <span>Activity</span>
                <span id="activityUnreadBadge" class="drawer-unread-badge hidden">0</span>
              </button>
            </div>
          </div>

          <!-- Chat Tab Panel -->
          <div class="drawer-tab-panel active" id="panelChat">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
              <input type="text" id="chatInput" placeholder="Type a message..." maxlength="300">
              <button id="sendChatBtn" class="btn btn-primary btn-sm" disabled>Send</button>
            </div>
          </div>

          <!-- Activity Tab Panel -->
          <div class="drawer-tab-panel" id="panelActivity">
            <div class="activity-messages" id="activityMessages"></div>
          </div>
        </div>
      </aside>

    </main>

    <!-- Guest Username Requirement Modal -->
    <div id="guestUsernameModal" class="modal-overlay hidden" style="position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 10000;">
      <div style="background: var(--bg-card, #1e293b); border: 1px solid var(--border-color, #334155); border-radius: 12px; padding: 24px; width: 90%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); text-align: center;">
        <div style="font-size: 2rem; margin-bottom: 8px;">👤</div>
        <h3 style="margin: 0 0 8px 0; color: var(--text-primary, #f8fafc); font-size: 1.25rem;">Enter Your Username</h3>
        <p style="margin: 0 0 16px 0; color: var(--text-muted, #94a3b8); font-size: 0.875rem;">A username is required to join this live code sharing session.</p>
        <form id="guestUsernameForm" onsubmit="event.preventDefault();">
          <input type="text" id="guestUsernameInput" placeholder="Enter username..." maxlength="30" autocomplete="off" style="width: 100%; padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border-color, #334155); background: var(--bg-surface, #0f172a); color: var(--text-primary, #f8fafc); font-size: 0.95rem; margin-bottom: 16px; outline: none; box-sizing: border-box;">
          <button type="submit" id="submitGuestUsernameBtn" class="btn btn-primary" style="width: 100%; padding: 10px; font-weight: 600; cursor: pointer;">Join Live Session</button>
        </form>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Real-time Collaborator Mouse Pointers Container -->
    <div id="mousePointerContainer" class="mouse-pointer-container"></div>

  </div>

  <!-- External Libraries: Socket.io, Pyodide & Prism JS -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  
  <!-- Application Logic -->
  <script src="/app.js?v=40"></script>
</body>
</html>
